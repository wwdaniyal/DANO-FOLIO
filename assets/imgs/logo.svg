<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="70" height="60" viewBox="0 0 70 60">
  <defs>
    <style>
      .cls-1 {
        filter: url(#filter);
      }
    </style>
    <filter id="filter" filterUnits="userSpaceOnUse">
      <feFlood result="flood" flood-color="#009cff"/>
      <feComposite result="composite" operator="in" in2="SourceGraphic"/>
      <feBlend result="blend" in2="SourceGraphic"/>
    </filter>
  </defs>
  <g class="cls-1">
    <image id="D_copy" data-name="D copy" x="36" y="32" width="14" height="28" xlink:href="data:img/png;base64,"/>
    <image id="D_copy_2" data-name="D copy 2" x="21" width="14" height="28" xlink:href="data:img/png;base64,"/>
  </g>
  <g class="cls-1">
    <image id="D_copy_3" data-name="D copy 3" x="5" y="31" width="28" height="14" xlink:href="data:img/png;base64,"/>
    <image id="D_copy_3-2" data-name="D copy 3" x="37" y="16" width="28" height="14" xlink:href="data:img/png;base64,"/>
  </g>
</svg>
